<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/player-overlay.css">
    <link rel="stylesheet" href="css/homepage-modal.css">
</head>
<body>
    <!-- Preloader -->
    <!-- <div id="preloader">
        <dotlottie-player
  src="https://lottie.host/d8f51eb7-96ab-4ef7-aa26-46a439a89d07/oOs41RlRTY.lottie"
  background="transparent"
  speed="1"
  style="width: 300px; height: 300px"
  loop
  autoplay
></dotlottie-player>
    </div> -->

    <!-- Mobile navigation -->
    <button class="menu-toggle" aria-label="Toggle navigation">
        <span class="hamburger-icon">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </span>
        <span class="close-icon">
            <i class="fas fa-times"></i>
        </span>
    </button>
    
    <div class="sidebar-overlay"></div>

    <!-- Main Application Structure -->
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>Harmony</span>
            </div>
            
            <ul class="nav-menu">
                <li class="active"><a href="#" data-tab="home"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#" data-tab="songs"><i class="fas fa-music"></i> Songs</a></li>
                <li><a href="#" data-tab="artists"><i class="fas fa-user"></i> Artists</a></li>
                <li><a href="#" data-tab="albums"><i class="fas fa-compact-disc"></i> Albums</a></li>
                <li><a href="#" data-tab="playlists"><i class="fas fa-list"></i> Playlists</a></li>
            </ul>
        </nav>
    
        <!-- Main Content Area -->
        <main class="main-content">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search for songs, artists, or albums...">
            </div>
    
            <!-- Content Tabs -->
            <div class="content-tabs">
                <button class="tab-button active" data-tab="songs">Songs</button>
                <button class="tab-button" data-tab="artists">Artists</button>
                <button class="tab-button" data-tab="albums">Albums</button>
                <button class="tab-button" data-tab="playlists">Playlists</button>
            </div>
    
            <div class="content-section" id="songs-tab">
                <h2>All Songs</h2>
                <div class="song-list">
                    <!-- Songs will be dynamically inserted here -->
                </div>
            </div>
    
            <div class="content-section hidden" id="artists-tab">
                <h2>Artists</h2>
                <div class="artist-grid">
                    <!-- Artists will be dynamically inserted here -->
                </div>
            </div>
    
            <div class="content-section hidden" id="albums-tab">
                <h2>Albums</h2>
                <div class="album-grid">
                    <!-- Albums will be dynamically inserted here -->
                </div>
            </div>
    
            <div class="content-section hidden" id="playlists-tab">
                <h2>Playlists</h2>
                <div class="playlist-grid">
                    <!-- Playlists will be dynamically inserted here -->
                </div>
            </div>
        </main>
    </div>
    
    <div class="player-controls-bar hidden">
        <div class="player-info">
            <img src="assets/default-cover.jpg" alt="Album Cover" class="mini-cover">
            <div class="track-details">
                <h4 class="track-title">No track selected</h4>
                <p class="track-artist">Unknown artist</p>
            </div>
        </div>
        <div class="player-center-controls">
            <button class="control-btn shuffle-btn"><i class="fas fa-random"></i></button>
            <button class="control-btn prev-btn"><i class="fas fa-step-backward"></i></button>
            <button class="control-btn play-btn"><i class="fas fa-play"></i></button>
            <button class="control-btn next-btn"><i class="fas fa-step-forward"></i></button>
            <button class="control-btn repeat-btn"><i class="fas fa-redo"></i></button>
        </div>
        <div class="player-progress">
            <span class="current-time">0:00</span>
            <input type="range" class="progress-bar" min="0" max="100" value="0">
            <span class="duration">0:00</span>
        </div>
        <div class="player-volume">
            <button class="volume-btn"><i class="fas fa-volume-up"></i></button>
            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>
    
    <!-- Music Player Overlay -->
    <div class="player-overlay hidden">
        <div class="overlay-content">
            <div class="album-art-container">
                <img src="assets/default-cover.jpg" alt="Album Cover" class="overlay-album-art">
            </div>
            <div class="overlay-track-info">
                <h3 class="overlay-track-title">No track selected</h3>
                <p class="overlay-track-artist">Unknown artist</p>
            </div>
            <div class="wave-progress-container">
                <div class="wave-progress"></div>
            </div>
            <div class="overlay-controls">
                <button class="overlay-control-btn shuffle-btn"><i class="fas fa-random"></i></button>
                <button class="overlay-control-btn prev-btn"><i class="fas fa-step-backward"></i></button>
                <button class="overlay-control-btn play-btn"><i class="fas fa-play"></i></button>
                <button class="overlay-control-btn next-btn"><i class="fas fa-step-forward"></i></button>
                <button class="overlay-control-btn repeat-btn"><i class="fas fa-redo"></i></button>
            </div>
        </div>
    </div>

    <!-- Artist/Album Modal -->
    <div class="content-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <img id="modal-cover" src="assets/default-cover.jpg" alt="Cover">
                <div>
                    <h2 id="modal-title">Title</h2>
                    <p id="modal-subtitle">Subtitle</p>
                </div>
            </div>
            <div class="modal-actions">
                <button id="play-all-btn" class="btn-primary">
                    <i class="fas fa-play"></i> Play All
                </button>
                <button id="add-all-btn" class="btn-secondary">
                    <i class="fas fa-plus"></i> Add to Playlist
                </button>
                <div class="select-all">
                    <input type="checkbox" id="select-all-checkbox">
                    <label for="select-all-checkbox">Select All</label>
                </div>
            </div>
            <div class="modal-songs-list">
                <!-- Songs will be inserted here -->
            </div>
        </div>
    </div>

<script
  src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
  type="module"
></script>


    <script type="module">
        import { setupMobileNavigation } from './js/navigation.js';
        setupMobileNavigation();
        import './js/script.js';
    </script>
</body>
</html>
