<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Songs | Harmony Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/songs-page.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>Harmony</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li class="active"><a href="songs.html"><i class="fas fa-music"></i> Your Songs</a></li>
                <li><a href="playlists.html"><i class="fas fa-list"></i> Your Playlists</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <h1>Your Songs</h1>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search your songs...">
            </div>
            
            <div class="song-list-container">
                <div class="song-list-header">
                    <div class="header-item">#</div>
                    <div class="header-item">Title</div>
                    <div class="header-item">Artist</div>
                    <div class="header-item">Album</div>
                    <div class="header-item"><i class="far fa-clock"></i></div>
                </div>
                <div class="song-list">
                    <!-- Songs will be dynamically inserted here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Player Controls Bar -->
    <div class="player-controls-bar hidden">
        <div class="player-info">
            <img src="assets/default-cover.jpg" alt="Album Cover" class="mini-cover">
            <div class="track-details">
                <h4 class="track-title">No track selected</h4>
                <p class="track-artist">Unknown artist</p>
            </div>
        </div>
        <div class="player-center-controls">
            <button class="control-btn shuffle-btn"><i class="fas fa-random"></i></button>
            <button class="control-btn prev-btn"><i class="fas fa-step-backward"></i></button>
            <!-- <button class="control-btn play-btn"><i class="fas fa-play"></i></button> -->
            <button class="control-btn play-btn">
                <i class="fas fa-play"></i>
            </button>
            <button class="control-btn next-btn"><i class="fas fa-step-forward"></i></button>
            <button class="control-btn repeat-btn"><i class="fas fa-redo"></i></button>
        </div>
        <div class="player-progress">
            <span class="current-time">0:00</span>
            <input type="range" class="progress-bar" min="0" max="100" value="0">
            <span class="duration">0:00</span>
        </div>
        <div class="player-volume">
            <button class="volume-btn"><i class="fas fa-volume-up"></i></button>
            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <script type="module" src="js/songs-page.js"></script>
</body>
</html>
