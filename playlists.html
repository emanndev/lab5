<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Playlists | Harmony Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/playlists-page.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/player-overlay.css">
</head>
<body>
      <!--Mobile navigation-->
      <button class="menu-toggle" aria-label="Toggle navigation">
        <span class="hamburger-icon">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </span>
        <span class="close-icon">
            <i class="fas fa-times"></i>
        </span>
    </button>
    
    <div class="sidebar-overlay"></div>

<!--Main Application Structure-->           
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>Harmony</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li class="active"><a href="playlists.html"><i class="fas fa-list"></i> Your Playlists</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="playlists-header">
                <h1>Your Playlists</h1>
                <button id="create-playlist-btn" class="btn-primary">
                    <i class="fas fa-plus"></i> New Playlist
                </button>
            </div>
            
            <div class="playlist-grid">
                <!-- Playlists will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <!-- Playlist Modal -->
    <div class="modal playlist-modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Create New Playlist</h3>
            <div class="form-group">
                <label for="playlist-name">Playlist Name</label>
                <input type="text" id="playlist-name" placeholder="My Awesome Playlist">
            </div>
            <button id="confirm-create-playlist" class="btn-primary">Create Playlist</button>
        </div>
    </div>

    <!-- Player Controls Bar -->
    <div class="player-controls-bar hidden">
        <div class="player-info">
            <img src="assets/default-cover.jpg" alt="Album Cover" class="mini-cover">
            <div class="track-details">
                <h4 class="track-title">No track selected</h4>
                <p class="track-artist">Unknown artist</p>
            </div>
        </div>
        <div class="player-center-controls">
            <button class="control-btn shuffle-btn"><i class="fas fa-random"></i></button>
            <button class="control-btn prev-btn"><i class="fas fa-step-backward"></i></button>
            <!-- <button class="control-btn play-btn"><i class="fas fa-play"></i></button> -->
            <button class="control-btn play-btn"><i class="fas fa-play"></i>  </button>
            <button class="control-btn next-btn"><i class="fas fa-step-forward"></i></button>
            <button class="control-btn repeat-btn"><i class="fas fa-redo"></i></button>
        </div>
        <div class="player-progress">
            <span class="current-time">0:00</span>
            <input type="range" class="progress-bar" min="0" max="100" value="0">
            <span class="duration">0:00</span>
        </div>
        <div class="player-volume">
            <button class="volume-btn"><i class="fas fa-volume-up"></i></button>
            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

<!-- Enhanced Music Player Overlay -->
<div class="player-overlay hidden">
    <div class="overlay-content">
        <div class="song-art-container">
            <img src="assets/default-cover.jpg" alt="Song Art" class="overlay-song-art">
        </div>
        <div class="overlay-track-info">
            <h3 class="overlay-track-title">No track selected</h3>
            <p class="overlay-track-artist">Unknown artist</p>
        </div>
        
        <!-- Modern Waveform Visualization -->
        <div class="waveform-container">
            <canvas id="waveform-canvas"></canvas>
            <div class="waveform-progress"></div>
        </div>
        
        <div class="overlay-controls">
            <button class="overlay-control-btn shuffle-btn"><i class="fas fa-random"></i></button>
            <button class="overlay-control-btn prev-btn"><i class="fas fa-step-backward"></i></button>
            <button class="overlay-control-btn play-btn"><i class="fas fa-play"></i></button>
            <button class="overlay-control-btn next-btn"><i class="fas fa-step-forward"></i></button>
            <button class="overlay-control-btn repeat-btn"><i class="fas fa-redo"></i></button>
        </div>
        
        <div class="time-display">
            <span class="current-time">0:00</span>
            <span class="duration">0:00</span>
        </div>
    </div>
</div>


    <script type="module">
        import { setupMobileNavigation } from './js/navigation.js';
        setupMobileNavigation();
        import './js/songs-page.js';
        import './js/script.js';
    </script>
</body>
</html>
